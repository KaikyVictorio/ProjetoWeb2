services:
  server:
    build:
      context: ./server
      target: dev
    ports:
      - "3001:3001"
    # server/.env é opcional (copie de server/.env.example para sobrescrever valores)
    env_file:
      - path: ./server/.env
        required: false
    environment:
      PORT: 3001
      DB_PATH: /app/data/estante.db
    volumes:
      - ./server:/app
      - /app/node_modules
      - dbdata:/app/data

  client:
    build:
      context: ./client
      target: dev
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://server:3001
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  dbdata:
