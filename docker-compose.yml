services:
  gateway:
    build:
      context: ./gateway
      target: dev
    ports:
      - "3000:3000"
    environment:
      - CATALOGO_URL=http://catalogo:4001
      - LEGADO_URL=http://server:3001
    volumes:
      - ./gateway:/app
      - /app/node_modules
    depends_on:
      - catalogo
      - server

  catalogo:
    build:
      context: ./services/catalogo
      target: dev
    ports:
      - "4001:4001"
    env_file:
      - path: ./services/catalogo/.env
        required: false
    volumes:
      - ./services/catalogo:/app
      - /app/node_modules

  server:
    build:
      context: ./server
      target: dev
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      target: dev
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://gateway:3000
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - gateway